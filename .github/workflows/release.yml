name: Release

# A vX.Y.Z tag builds the image for amd64 and arm64, boots both, pushes the
# exact version to GHCR and Docker Hub, creates the GitHub release from
# .github/release-notes/<tag>.md and only then moves latest, X.Y and X, so
# `docker pull ...:latest` never names a version without a release.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/junkerderprovinz/parleyport
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Notes exist for this tag
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$file" ]; then
            echo "::error::no release notes at $file, write them before tagging."
            exit 1
          fi

  image:
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      HUB: ${{ vars.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build both arches for the smoke test
        run: |
          set -eu
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" --load \
              --build-arg VERSION="${GITHUB_REF_NAME}" --build-arg COMMIT="${GITHUB_SHA}" \
              -t "parleyport:smoke-${arch}" .
          done

      # arm64 runs under QEMU and gets a larger boot budget.
      - name: Both arches must boot and answer /health
        run: |
          set -eu
          smoke() {
            arch="$1" budget="$2"
            docker run -d --name "pp-${arch}" --platform "linux/${arch}" -p 8760:8760 "parleyport:smoke-${arch}"
            for i in $(seq 1 "$budget"); do
              if body="$(curl -fsS http://127.0.0.1:8760/health)"; then
                echo "${arch}: ${body} after ${i}s"
                echo "$body" | grep -q "\"version\":\"${GITHUB_REF_NAME}\""
                docker rm -f "pp-${arch}" >/dev/null
                return 0
              fi
              sleep 1
            done
            docker logs "pp-${arch}" || true
            docker rm -f "pp-${arch}" >/dev/null
            return 1
          }
          smoke amd64 30
          smoke arm64 90

      # A fresh advisory belongs in the Security tab, not in the way of a
      # release, so the scan never fails the run.
      - name: Scan for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: parleyport:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/parleyport,enable=${{ env.HUB }}
          # latest waits for the release, see the latest job.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          make_latest: true

  latest:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      HUB: ${{ vars.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move latest, X.Y and X to this release
        env:
          IMAGES: ${{ env.IMAGE }} ${{ env.HUB == 'true' && format('docker.io/{0}/parleyport', vars.DOCKERHUB_USERNAME) || '' }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for image in $IMAGES; do
            docker buildx imagetools inspect "${image}:${version}" > /dev/null
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${version%.*}" \
              --tag "${image}:${version%%.*}" \
              "${image}:${version}"
            echo "${image}: latest, ${version%.*} and ${version%%.*} are ${version}"
          done
