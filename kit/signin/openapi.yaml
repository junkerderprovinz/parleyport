openapi: 3.1.0
info:
  title: Sign-in
  version: "1"
  description: |
    The sign-in every app of the kit shares. Requests that change something
    send JSON and come from the app's own pages: Sec-Fetch-Site same-origin
    or none, or else an Origin that is the app's public address. With
    neither header only an API token counts, never a cookie. Every error is
    a code, never a sentence:
    {"error": "<code>"}, with more fields where a code says so.

    Besides this API the package serves the browser routes of a sign-in
    service: GET /signin/oidc/{id} with return, renew=1 or ticket, and
    GET /signin/oidc/callback, below the app's base path. A service the app
    sets up itself can also start and come back on paths of the app's own.
    They answer with redirects, and the outcome comes back to the return
    path as ?signin=<code>, one of RedirectCode.
servers:
  - url: /api/signin/v1
paths:
  /options:
    get:
      operationId: getOptions
      summary: What the sign-in page offers
      responses:
        "200":
          description: The ways in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Options" }
  /login:
    post:
      operationId: login
      summary: Sign in with the password
      description: |
        In an app with one owner the name is left out. With two-factor on,
        the answer is {"step": "code"} and a cookie for login/totp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                name: { type: string }
                password: { type: string, maxLength: 1024 }
      responses:
        "200": { $ref: "#/components/responses/SignedInOrStep" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Throttled" }
  /login/totp:
    post:
      operationId: loginTOTP
      summary: The code from the authenticator app, or a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Code" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Throttled" }
  /login/passkey/options:
    post:
      operationId: loginPasskeyOptions
      summary: Options for navigator.credentials.get with conditional mediation
      responses:
        "200": { $ref: "#/components/responses/WebAuthn" }
        "409": { $ref: "#/components/responses/Error" }
  /login/passkey:
    post:
      operationId: loginPasskey
      summary: Sign in with the passkey the browser offered in the password field
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: The PublicKeyCredential as JSON. }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /logout:
    post:
      operationId: logout
      summary: End this session
      responses:
        "200": { $ref: "#/components/responses/Done" }
  /reset-code:
    post:
      operationId: resetCode
      summary: Print a reset code to the container log
      description: At most once a minute. The code is valid for 10 minutes.
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "409": { $ref: "#/components/responses/Error" }
  /reset:
    post:
      operationId: reset
      summary: Set a new password with the code from the log
      description: |
        Ends every session and token, removes the owner's passkeys, second
        factor and bindings to sign-in services, and pauses every service.
        Each service needs a new test sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: { type: string }
                password: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Reset and signed in.
          content:
            application/json:
              schema:
                type: object
                required: [removed, visitor]
                properties:
                  visitor: { $ref: "#/components/schemas/Visitor" }
                  short: { $ref: "#/components/schemas/Short" }
                  removed:
                    type: object
                    required: [tokens, passkeys, twoFactor, services]
                    properties:
                      tokens: { type: integer }
                      passkeys: { type: integer }
                      twoFactor: { type: boolean }
                      services: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Throttled" }
  /me:
    get:
      operationId: getMe
      summary: Who is asking
      description: The one route an API token may call.
      responses:
        "200":
          description: The visitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /me/password:
    put:
      operationId: setPassword
      summary: Set the first password, or change it
      description: |
        While the app is open, this sets the first password, and whoever sets
        it becomes the owner and is signed in. A change needs the current
        password and ends every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [next]
              properties:
                name: { type: string }
                current: { type: string }
                next: { type: string, maxLength: 1024 }
      responses:
        "200": { $ref: "#/components/responses/PasswordSet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removePassword
      summary: Take the owner's password away, which opens the app
      description: |
        In an app with many accounts only while no other account signs in
        with a password or a sign-in service, or othersSignIn.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/confirm:
    post:
      operationId: confirm
      summary: Sign in again in this session, for a change that wants it fresh
      description: Refused with confirmOff while an admin has turned the question off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/sessions:
    get:
      operationId: getSessions
      summary: The account's sessions
      responses:
        "200":
          description: Newest use first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    delete:
      operationId: endOtherSessions
      summary: End every other session, and old ones from before the import
      description: This browser gets a new session.
      responses:
        "200":
          description: How many ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ended: { type: integer }
  /me/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: endSession
      summary: End one session
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "404": { $ref: "#/components/responses/Error" }
  /me/totp:
    post:
      operationId: startTOTP
      summary: A new secret for an authenticator app
      responses:
        "200":
          description: The secret and the URI for the QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri]
                properties:
                  secret: { type: string }
                  uri: { type: string }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopTOTP
      summary: Turn two-factor off with a code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Code" }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Error" }
  /me/totp/confirm:
    post:
      operationId: confirmTOTP
      summary: Turn two-factor on with the first code
      description: Ends every other session, and shows the recovery codes once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Code" }
      responses:
        "200": { $ref: "#/components/responses/Codes" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/totp/codes:
    post:
      operationId: newRecoveryCodes
      summary: New recovery codes in place of the old
      responses:
        "200": { $ref: "#/components/responses/Codes" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/passkeys:
    get:
      operationId: getPasskeys
      summary: The account's passkeys
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/Passkey" }
    post:
      operationId: addPasskey
      summary: Keep the passkey the browser made
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                name: { type: string }
                credential: { type: object }
      responses:
        "200":
          description: The new passkey's id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/passkeys/options:
    post:
      operationId: passkeyOptions
      summary: Options for navigator.credentials.create
      responses:
        "200": { $ref: "#/components/responses/WebAuthn" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removePasskey
      summary: Remove a passkey
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "404": { $ref: "#/components/responses/Error" }
  /me/identities:
    get:
      operationId: getIdentities
      summary: The sign-in services that sign in as this account
      responses:
        "200":
          description: The identities.
          content:
            application/json:
              schema:
                type: object
                required: [identities]
                properties:
                  identities:
                    type: array
                    items: { $ref: "#/components/schemas/Identity" }
  /me/identities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unlinkIdentity
      summary: Unlink one, unless it is the last way in of an account without a password
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/identities/{service}/link:
    parameters:
      - { name: service, in: path, required: true, schema: { type: string } }
    post:
      operationId: linkService
      summary: The address that links this account to a person at the sign-in service
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Return" }
      responses:
        "200": { $ref: "#/components/responses/StartURL" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/tokens:
    get:
      operationId: getTokens
      summary: The account's API tokens
      responses:
        "200":
          description: The tokens, without their values.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }
    post:
      operationId: makeToken
      summary: A new API token, shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 64 }
                scopes: { type: array, items: { type: string } }
                days: { type: integer, minimum: 1, maximum: 3650, description: Empty is 90. }
                never: { type: boolean }
      responses:
        "200":
          description: The token and its value.
          content:
            application/json:
              schema:
                type: object
                required: [token, value]
                properties:
                  token: { $ref: "#/components/schemas/Token" }
                  value: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeToken
      summary: Revoke a token
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "404": { $ref: "#/components/responses/Error" }
  /accounts:
    get:
      operationId: getAccounts
      summary: Every account, the owner first
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: addAccount
      summary: A local account with a password, in an app with many accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, role]
              properties:
                name: { type: string }
                password: { type: string }
                role: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OneAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: changeAccount
      summary: Rename, block, unblock or give another role
      description: |
        Blocking or a lower role ends the account's sessions and tokens. The
        owner's role and block stay, and only the owner renames itself. The
        name of a removed account stays taken until the app took the removal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                blocked: { type: boolean }
                role: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OneAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeAccount
      summary: Remove an account and every way in it had
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /roles:
    get:
      operationId: getRoles
      summary: The app's roles, the admin first, and the one newcomers from a sign-in service get
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roles" }
  /methods/presets:
    get:
      operationId: getPresets
      summary: What the server knows per kind of sign-in service, by the catalog's ids
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/Preset" }
  /methods/oidc:
    get:
      operationId: getServices
      summary: The sign-in services
      responses:
        "200":
          description: The services, never their secrets.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
    post:
      operationId: addService
      summary: Add a sign-in service, off until its test sign-in
      description: Issuer, client and secret are enough. The rest comes from the provider's preset, the endpoints from discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200": { $ref: "#/components/responses/OneService" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /methods/oidc/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: changeService
      summary: Change a sign-in service
      description: |
        A new issuer or client needs the secret again. Any change to them takes
        the service off until a new test sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200": { $ref: "#/components/responses/OneService" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeService
      summary: Remove a sign-in service
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /methods/oidc/{id}/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkService
      summary: Whether the app reaches the service's discovery document
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /methods/oidc/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: testService
      summary: The address of the test sign-in, which binds the admin and turns the service on
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Return" }
      responses:
        "200": { $ref: "#/components/responses/StartURL" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings:
    get:
      operationId: getSettings
      summary: The app-wide choices about sign-in
      responses:
        "200": { $ref: "#/components/responses/Settings" }
    patch:
      operationId: changeSettings
      summary: Change them, saved at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                askPassword: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /log:
    get:
      operationId: getLog
      summary: The sign-in log, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
components:
  responses:
    Done:
      description: Done.
      content:
        application/json:
          schema: { type: object }
    Error:
      description: Refused, with a code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Throttled:
      description: Too many attempts. Retry-After and retryAfter say when to try again.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignedIn:
      description: Signed in, with a session cookie.
      content:
        application/json:
          schema:
            type: object
            required: [visitor]
            properties:
              visitor: { $ref: "#/components/schemas/Visitor" }
    SignedInOrStep:
      description: Signed in, or waiting for the second factor.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [visitor]
                properties:
                  visitor: { $ref: "#/components/schemas/Visitor" }
              - type: object
                required: [step]
                properties:
                  step: { const: code }
    Codes:
      description: Recovery codes, shown once.
      content:
        application/json:
          schema:
            type: object
            required: [codes]
            properties:
              codes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 }
    WebAuthn:
      description: Options as navigator.credentials takes them, under publicKey.
      content:
        application/json:
          schema:
            type: object
            required: [publicKey]
            properties:
              publicKey: { type: object }
              mediation: { type: string }
    StartURL:
      description: Where to send the browser.
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: { type: string }
    OneAccount:
      description: The account.
      content:
        application/json:
          schema:
            type: object
            required: [account]
            properties:
              account: { $ref: "#/components/schemas/Account" }
              short: { $ref: "#/components/schemas/Short" }
    PasswordSet:
      description: The password is set. The first one also signs in.
      content:
        application/json:
          schema:
            type: object
            properties:
              visitor: { $ref: "#/components/schemas/Visitor" }
              short: { $ref: "#/components/schemas/Short" }
    OneService:
      description: The sign-in service.
      content:
        application/json:
          schema:
            type: object
            required: [service]
            properties:
              service: { $ref: "#/components/schemas/Service" }
    Settings:
      description: The app-wide choices about sign-in.
      content:
        application/json:
          schema:
            type: object
            required: [askPassword]
            properties:
              askPassword:
                type: boolean
                description: Before a change that wants a sign-in from moments ago, the app asks for the password instead of a new sign-in. On unless an admin turned it off.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - accountOwner
            - badRequest
            - blocked
            - caInvalid
            - confirmOff
            - crossSite
            - forbidden
            - internal
            - issuerInvalid
            - lastWayIn

            - nameInvalid
            - nameTaken
            - noAccount
            - notFound
            - notJSON
            - notLocal
            - notOwner
            - notWithToken
            - fromConfig
            - oneOwner
            - othersSignIn
            - passkeyRefused
            - passkeysUnavailable
            - passkeyUnknown
            - passwordLong
            - passwordSet
            - passwordMissing

            - resetRefused
            - roleUnknown
            - scopeUnknown
            - secretAgain
            - secretMissing
            - serviceOff
            - serviceUnknown
            - serviceUnreachable
            - serviceUntested
            - setPasswordFirst
            - setupExpired
            - signInAgain
            - signInFirst
            - stepExpired

            - throttled
            - tokenNameMissing
            - tooLarge
            - twoFactorOff
            - wrongCode
            - wrongPassword
        retryAfter: { type: integer, description: Seconds, with throttled. }
        askPassword: { type: boolean, description: With signInAgain, whether the app may ask for the password through me/confirm instead of a new sign-in. }
        scope: { type: string, description: The scope it does not know, with scopeUnknown. }
    RedirectCode:
      description: What comes back to the return path of a browser route as ?signin=<code>.
      type: string
      enum:
        - addressMissing
        - blocked
        - flowExpired
        - identityTaken
        - linked
        - nameMissing
        - nameTaken
        - noAccount
        - notAdmitted
        - renewNeeded
        - serviceOff
        - serviceRefused
        - serviceUnknown
        - serviceUnreachable
        - signInFirst
        - testOk
        - throttled
    Via:
      type: string
      enum: [open, password, passkey, service, token, door]
    Visitor:
      type: object
      required: [role, via]
      properties:
        account: { type: string }
        name: { type: string }
        role: { type: string }
        via: { $ref: "#/components/schemas/Via" }
        service: { type: string }
        scopes: { type: array, items: { type: string } }
    Me:
      allOf:
        - $ref: "#/components/schemas/Visitor"
        - type: object
          required: [owner, password, twoFactor, recoveryLeft, fresh, askPassword]
          properties:
            owner: { type: boolean }
            password: { type: boolean }
            twoFactor: { type: boolean }
            recoveryLeft: { type: integer }
            fresh: { type: boolean, description: Signed in moments ago, as new lasting ways in want. }
            askPassword: { type: boolean, description: The app may ask for the password through me/confirm when a change wants a fresh sign-in. }
    Options:
      type: object
      required: [open, owner, minPassword, signedIn, passkeys, services]
      properties:
        open: { type: boolean, description: Nobody can sign in, so everyone is admin. }
        owner: { type: boolean, description: One local account, so the page asks for no name. }
        minPassword: { type: integer, description: Below this many characters a new password is taken with a hint, never refused. }
        signedIn: { type: boolean }
        passkeys: { type: boolean, description: Ask for passkeys with conditional mediation. }
        renew: { type: string, description: The sign-in service whose session can be renewed without asking. }
        services:
          type: array
          items:
            type: object
            required: [id, provider, name]
            properties:
              id: { type: string }
              provider: { type: string, description: "The preset it was set up as or recognised as, else custom." }
              name: { type: string, description: The name it was set up with, empty when it has none. }
    Code:
      type: object
      required: [code]
      properties:
        code: { type: string }
    Return:
      type: object
      properties:
        return: { type: string, description: A path on the app to come back to. }
    Session:
      type: object
      required: [id, via, created, seen, current]
      properties:
        id: { type: string }
        via: { $ref: "#/components/schemas/Via" }
        service: { type: string }
        created: { type: string, format: date-time }
        seen: { type: string, format: date-time }
        from: { type: string }
        agent: { type: string }
        current: { type: boolean }
    Token:
      type: object
      required: [id, name, scopes, created]
      properties:
        id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        created: { type: string, format: date-time }
        used: { type: string, format: date-time }
        expires: { type: string, format: date-time }
    Passkey:
      type: object
      required: [id, name, created, rpID, synced, here]
      properties:
        id: { type: string }
        name: { type: string }
        created: { type: string, format: date-time }
        used: { type: string, format: date-time }
        rpID: { type: string }
        synced: { type: boolean }
        here: { type: boolean, description: Made for the app's address of today. }
    Identity:
      type: object
      required: [id, kind, linked]
      properties:
        id: { type: string }
        kind: { type: string, enum: [service] }
        service: { type: string }
        name: { type: string }
        linked: { type: string, format: date-time }
        seen: { type: string, format: date-time }
    Account:
      type: object
      required: [id, name, role, owner, via, created, blocked, password, twoFactor]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        owner: { type: boolean }
        via: { $ref: "#/components/schemas/Via" }
        service: { type: string }
        created: { type: string, format: date-time }
        seen: { type: string, format: date-time }
        blocked: { type: boolean }
        password: { type: boolean }
        twoFactor: { type: boolean }
        groups: { type: array, items: { type: string } }
    Short:
      type: boolean
      description: The password is shorter than minPassword of GET options. It is taken, and the app may say it is short.
    Roles:
      type: object
      required: [roles, serviceRole]
      properties:
        roles: { type: array, items: { type: string } }
        serviceRole: { type: string, description: The role a new service takes when none is given. }
    Preset:
      type: object
      required: [id, scopes, nameClaim, groupsClaim]
      properties:
        id: { type: string }
        scopes: { type: string }
        nameClaim: { type: string }
        groupsClaim: { type: string }
    ServiceInput:
      type: object
      properties:
        provider: { type: string, description: "A preset id. Absent or custom, the service is recognised from its discovery." }
        name: { type: string, description: What the sign-in page calls it. Absent or empty, the app names it after its provider. }
        issuer: { type: string }
        clientId: { type: string }
        secret: { type: string }
        scopes: { type: string, description: Absent or empty takes the provider's. }
        nameClaim: { type: string, description: Absent or empty takes the provider's. }
        groupsClaim: { type: string, description: Absent or empty takes the provider's. }
        ca: { type: string, description: A PEM certificate to trust next to the system's. }
        on: { type: boolean }
        role: { type: string, description: "What a newcomer from the service gets, one of the roles, else roleUnknown. A change leaves existing accounts as they are. Absent on a new service is serviceRole of GET roles." }
    Service:
      type: object
      required: [id, provider, name, issuer, clientId, secretSet, scopes, nameClaim, groupsClaim, ca, on, paused, tested, redirect, fromConfig, role]
      properties:
        id: { type: string }
        provider: { type: string }
        name: { type: string }
        issuer: { type: string }
        clientId: { type: string }
        secretSet: { type: boolean }
        scopes: { type: string }
        nameClaim: { type: string }
        groupsClaim: { type: string }
        ca: { type: boolean }
        on: { type: boolean }
        paused: { type: boolean, description: A reset took it off. }
        tested: { type: boolean }
        testedAt: { type: string, format: date-time }
        redirect: { type: string, description: The address to register at the service. }
        fromConfig: { type: boolean, description: The app sets it up itself. Only on can change, to turn it on again after a reset. }
        role: { type: string, description: What a newcomer from the service gets. }
    Entry:
      type: object
      required: [at, result]
      properties:
        at: { type: string, format: date-time }
        account: { type: string }
        name: { type: string, description: An account's name, or a tag for a name no account has. }
        via: { $ref: "#/components/schemas/Via" }
        service: { type: string }
        from: { type: string }
        result: { type: string }
        agent: { type: string }
        count: { type: integer }
